# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: The Vermaas Lab
email: vermaasj@msu.edu
description: > # this means to ignore newlines until "baseurl:"
  Website for the Vermaas Lab at MSU, which uses molecular simulation techniques to study biological systems of interest to renewable materials and energy applications.
baseurl: ""
url: ""

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Explicit plugin list -- previously activated implicitly by the
# "github-pages" gem; now that the site builds via GitHub Actions
# (see .github/workflows/build-deploy.yml) these must be named here.
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-scholar



# Publications bibliography (jekyll-scholar)
# references.bib is auto-exported by Zotero + Better BibTeX from the
# "MyPapers" collection -- see _bibliography/README.md for how to add a
# paper and how to flag highlight/image/news fields via Zotero's Extra field.
scholar:
  style: apa
  locale: en

  source: ./_bibliography
  bibliography: references.bib

  bibliography_template: full

  sort_by: year
  order: descending

  first_name_initials: true
  use_raw_bibtex_entry: true

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
